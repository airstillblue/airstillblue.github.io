<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korean Voice Cloning & Editing</title>
    <!-- 引入Tailwind CSS简化样式开发，保证视觉一致性 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 自定义配置：统一颜色、字体和圆角 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb', // 主色调：柔和蓝，提升专业感
                        neutral: '#f3f4f6', // 中性色：浅灰，用于背景分隔
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'], // 无衬线字体，清晰易读
                    },
                    borderRadius: {
                        'sm': '0.25rem',
                        'md': '0.5rem',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            /* 自定义工具类：表格行悬停效果、音频控件美化 */
            .table-hover {
                @apply transition-colors duration-200 hover:bg-neutral/50;
            }
            .audio-control {
                @apply w-full max-w-[200px] rounded-md border border-gray-200 shadow-sm;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 顶部导航 -->
        <header class="mb-8">
            <!-- 返回主页按钮：突出交互性，hover有反馈 -->
            <a href="home.html" class="inline-block px-4 py-2 bg-primary text-white rounded-md transition-all duration-200 hover:bg-primary/90 hover:shadow-md">
                返回主页
            </a>
            <!-- 标题：层级清晰，视觉突出 -->
            <h1 class="mt-6 text-[clamp(1.8rem,3vw,2.5rem)] font-bold text-gray-900">
                Korean Voice Cloning & Editing 
            </h1>
            <!-- 分割线：简化样式，更显精致 -->
            <hr class="mt-4 border-t-2 border-gray-800 rounded-full">
        </header>

        <!-- 核心内容：表格 -->
        <main>
            <!-- 响应式表格容器：小屏幕可横向滚动 -->
            <div class="overflow-x-auto rounded-md shadow-md">
                <table class="w-full border-collapse bg-white">
                    <!-- 表头：深色背景，突出标题 -->
                    <thead class="bg-gray-900 text-white">
                        <tr>
                            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">ID</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">Prompt Text</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider w-56">Prompt Audio</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">Target Text</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider w-56">Clone Audio</th>
                        </tr>
                    </thead>
                    <!-- 表体：交替行背景，提升可读性；悬停效果增强交互 -->











                </table>
            </div>
        </main>


        <!-- 分割线：简化样式，更显精致 -->
        <hr class="my-8 border-t-2 border-gray-800 rounded-full">


        <!-- 核心内容：表格 -->
        <main>
            <!-- 响应式表格容器：小屏幕可横向滚动 -->
            <div class="overflow-x-auto rounded-md shadow-md">
                <table class="w-full border-collapse bg-white">
                    <!-- 表头：深色背景，突出标题 -->
                    <thead class="bg-gray-900 text-white">
                        <tr>
                            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">ID</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">Original Text</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider w-56">Original Audio</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">Edited Text</th>
                            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider w-56">Edited Audio</th>
                        </tr>
                    </thead>
                    <!-- 表体：交替行背景，提升可读性；悬停效果增强交互 -->








                </table>
            </div>
        </main>

        <!-- 页脚：简洁说明，提升专业性 -->
        <footer class="mt-10 text-center text-sm text-gray-500">
            <p>© Demo by LI Xin </p>
        </footer>
    </div>
</body>

</html>
